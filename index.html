<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Kenteken Zoeker" />
  <title>🏎️ Kenteken Zoeker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json" />
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 font-sans">

  <h1 class="text-2xl font-bold text-yellow-400 mb-4">🏎️ Kenteken Zoeker</h1>

  <!-- Search inputs -->
  <div class="flex flex-col gap-3 mb-4">
    <input id="inpKenteken" type="text" placeholder="Kenteken (bijv. SIDZ26 of gedeeltelijk)"
      class="rounded-xl p-3 bg-gray-800 text-white placeholder-gray-500 uppercase tracking-widest text-lg" />

    <div class="flex gap-2">
      <input id="inpMerk" type="text" placeholder="Merk (bijv. Ferrari)"
        class="flex-1 rounded-xl p-3 bg-gray-800 text-white placeholder-gray-500" />
      <input id="inpLetters" type="text" placeholder="Bevat (bijv. 55)"
        class="w-28 rounded-xl p-3 bg-gray-800 text-white placeholder-gray-500 uppercase" />
    </div>

    <button id="zoekKnop" type="button"
      class="rounded-xl p-3 bg-yellow-400 text-gray-900 font-bold text-lg active:bg-yellow-300">
      🔍 Zoeken
    </button>
  </div>

  <!-- Status -->
  <p id="status" class="text-gray-400 text-sm mb-3"></p>

  <!-- Result filters -->
  <div id="resultaatFilters" class="hidden grid grid-cols-2 gap-2 mb-4">
    <label class="text-sm text-gray-300">
      Merk
      <select id="filterMerk"
        class="mt-1 w-full rounded-xl p-3 bg-gray-800 text-white">
        <option value="">Alle merken</option>
      </select>
    </label>
    <label class="text-sm text-gray-300">
      Kleur
      <select id="filterKleur"
        class="mt-1 w-full rounded-xl p-3 bg-gray-800 text-white">
        <option value="">Alle kleuren</option>
      </select>
    </label>
    <label class="text-sm text-gray-300">
      Bijzonderheidsscore
      <select id="filterScore"
        class="mt-1 w-full rounded-xl p-3 bg-gray-800 text-white disabled:text-gray-500">
        <option value="0">Alle scores</option>
        <option value="100">100+ Interessant</option>
        <option value="250">250+ Sportief</option>
        <option value="450">450+ Zeer bijzonder</option>
        <option value="650">650+ Exotisch</option>
      </select>
    </label>
    <label class="text-sm text-gray-300">
      Sortering
      <select id="sortering"
        class="mt-1 w-full rounded-xl p-3 bg-gray-800 text-white">
        <option id="sorteerOpScore" value="score">Hoogste score</option>
        <option value="merk">Merk</option>
        <option value="vermogen">Hoogste vermogen</option>
        <option value="verhouding">Beste pk/gewicht</option>
        <option value="prijs">Hoogste catalogusprijs</option>
        <option value="oudste">Oudste eerst</option>
      </select>
    </label>
  </div>

  <!-- Results -->
  <div id="resultaten" class="flex flex-col gap-3"></div>

  <!-- Pagination -->
  <div id="paginering" class="hidden mt-4 flex items-center justify-between gap-3">
    <button id="vorigePagina" type="button"
      class="rounded-xl px-4 py-2 bg-gray-800 text-white disabled:text-gray-600 disabled:cursor-not-allowed">
      ← Vorige
    </button>
    <span id="paginaStatus" class="text-sm text-gray-400"></span>
    <button id="volgendePagina" type="button"
      class="rounded-xl px-4 py-2 bg-gray-800 text-white disabled:text-gray-600 disabled:cursor-not-allowed">
      Volgende →
    </button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
