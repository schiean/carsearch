<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Kenteken Zoeker" />
  <title>🏎️ Kenteken Zoeker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="manifest" href="manifest.json" />
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 font-sans">

  <h1 class="text-2xl font-bold text-yellow-400 mb-4">🏎️ Kenteken Zoeker</h1>

  <!-- Search inputs -->
  <div class="flex flex-col gap-3 mb-4">
    <input id="inpKenteken" type="text" placeholder="Kenteken (bijv. SIDZ26 of gedeeltelijk)"
      class="rounded-xl p-3 bg-gray-800 text-white placeholder-gray-500 uppercase tracking-widest text-lg" />

    <div class="flex gap-2">
      <input id="inpMerk" type="text" placeholder="Merk (bijv. Ferrari)"
        class="flex-1 rounded-xl p-3 bg-gray-800 text-white placeholder-gray-500" />
      <input id="inpLetters" type="text" placeholder="Bevat (bijv. 55)"
        class="w-28 rounded-xl p-3 bg-gray-800 text-white placeholder-gray-500 uppercase" />
    </div>

    <button onclick="zoek()"
      class="rounded-xl p-3 bg-yellow-400 text-gray-900 font-bold text-lg active:bg-yellow-300">
      🔍 Zoeken
    </button>
  </div>

  <!-- Status -->
  <p id="status" class="text-gray-400 text-sm mb-3"></p>

  <!-- Result filters -->
  <div id="resultaatFilters" class="hidden grid grid-cols-2 gap-2 mb-4">
    <label class="text-sm text-gray-300">
      Merk
      <select id="filterMerk"
        class="mt-1 w-full rounded-xl p-3 bg-gray-800 text-white">
        <option value="">Alle merken</option>
      </select>
    </label>
    <label class="text-sm text-gray-300">
      Kleur
      <select id="filterKleur"
        class="mt-1 w-full rounded-xl p-3 bg-gray-800 text-white">
        <option value="">Alle kleuren</option>
      </select>
    </label>
    <label class="text-sm text-gray-300">
      Bijzonderheidsscore
      <select id="filterScore"
        class="mt-1 w-full rounded-xl p-3 bg-gray-800 text-white disabled:text-gray-500">
        <option value="0">Alle scores</option>
        <option value="100">100+ Interessant</option>
        <option value="250">250+ Sportief</option>
        <option value="450">450+ Zeer bijzonder</option>
        <option value="650">650+ Exotisch</option>
      </select>
    </label>
    <label class="text-sm text-gray-300">
      Sortering
      <select id="sortering"
        class="mt-1 w-full rounded-xl p-3 bg-gray-800 text-white">
        <option id="sorteerOpScore" value="score">Hoogste score</option>
        <option value="merk">Merk</option>
        <option value="vermogen">Hoogste vermogen</option>
        <option value="verhouding">Beste pk/gewicht</option>
        <option value="prijs">Hoogste catalogusprijs</option>
        <option value="oudste">Oudste eerst</option>
      </select>
    </label>
  </div>

  <!-- Results -->
  <div id="resultaten" class="flex flex-col gap-3"></div>

  <!-- Pagination -->
  <div id="paginering" class="hidden mt-4 flex items-center justify-between gap-3">
    <button id="vorigePagina" type="button"
      class="rounded-xl px-4 py-2 bg-gray-800 text-white disabled:text-gray-600 disabled:cursor-not-allowed">
      ← Vorige
    </button>
    <span id="paginaStatus" class="text-sm text-gray-400"></span>
    <button id="volgendePagina" type="button"
      class="rounded-xl px-4 py-2 bg-gray-800 text-white disabled:text-gray-600 disabled:cursor-not-allowed">
      Volgende →
    </button>
  </div>

  <script>
    const VOERTUIGEN_BASE = "https://opendata.rdw.nl/resource/m9d7-ebf2.json";
    const BRANDSTOFFEN_BASE = "https://opendata.rdw.nl/resource/8ys7-d773.json";
    const MAX_ZOEKRESULTATEN = 500;
    const MAX_BRANDSTOFRESULTATEN = 1000;
    const RESULTATEN_PER_PAGINA = 20;
    const EERDER_GEZIEN_BONUS = 200;
    let zoekresultaten = [];
    let huidigePagina = 1;
    let scoreOndersteund = false;
    let brandstofResultaatAfgekapt = false;
    let kentekenHistorieAanvraag;

    function leesZoekcriteriaUitFormulier() {
      return {
        kenteken: document.getElementById("inpKenteken").value.replace(/-/g, "").toUpperCase().trim(),
        merk: document.getElementById("inpMerk").value.trim().toUpperCase(),
        bevat: document.getElementById("inpLetters").value.replace(/-/g, "").toUpperCase().trim()
      };
    }

    function werkZoekUrlBij(zoekcriteria) {
      const url = new URL(window.location.href);
      const params = new URLSearchParams();

      for (const [naam, waarde] of Object.entries(zoekcriteria)) {
        if (waarde) params.set(naam, waarde);
      }

      url.search = params.toString();
      window.history.replaceState(null, "", url);
    }

    function herstelZoekcriteriaUitUrl() {
      const params = new URLSearchParams(window.location.search);
      const zoekcriteria = {
        kenteken: params.get("kenteken") ?? "",
        merk: params.get("merk") ?? "",
        bevat: params.get("bevat") ?? ""
      };

      document.getElementById("inpKenteken").value = zoekcriteria.kenteken;
      document.getElementById("inpMerk").value = zoekcriteria.merk;
      document.getElementById("inpLetters").value = zoekcriteria.bevat;
      return zoekcriteria;
    }

    async function zoek(urlBijwerken = true) {
      const zoekcriteria = leesZoekcriteriaUitFormulier();
      const { kenteken, merk, bevat } = zoekcriteria;

      const setStatus = t => document.getElementById("status").textContent = t;
      const container = document.getElementById("resultaten");
      container.innerHTML = "";
      zoekresultaten = [];
      huidigePagina = 1;
      scoreOndersteund = Boolean(kenteken);
      brandstofResultaatAfgekapt = false;
      verbergResultaatFilters();
      verbergPaginering();
      setStatus("⏳ Zoeken...");

      // Fixed filter: only Personenauto's
      const filters = ["voertuigsoort='Personenauto'"];

      if (kenteken) {
        // Exact match first; if partial (< 6 chars) do a LIKE search
        if (kenteken.length >= 6) {
          filters.push(`kenteken='${kenteken}'`);
        } else {
          filters.push(`starts_with(kenteken,'${kenteken}')`);
        }
      }

      if (merk)    filters.push(`upper(merk)='${merk}'`);
      if (bevat) filters.push(`contains(kenteken,'${bevat}')`);

      if (filters.length <= 1 && !merk && !bevat && !kenteken) {
        setStatus("⚠️ Vul minimaal één zoekveld in.");
        return;
      }

      if (urlBijwerken) {
        werkZoekUrlBij(zoekcriteria);
      }

      const params = new URLSearchParams({
        $where: filters.join(" AND "),
        $limit: MAX_ZOEKRESULTATEN,
        $order: kenteken ? "kenteken ASC" : "merk ASC"
      });

      try {
        const voertuigAanvraag = haalRdwGegevens(VOERTUIGEN_BASE, params);
        const brandstofAanvraag = kenteken
          ? haalBrandstofGegevens(kenteken)
          : Promise.resolve([]);
        const [data, brandstofGegevens, kentekenHistorie] = await Promise.all([
          voertuigAanvraag,
          brandstofAanvraag,
          haalKentekenHistorie()
        ]);

        if (!data.length) {
          setStatus("❌ Geen resultaten gevonden.");
          return;
        }

        brandstofResultaatAfgekapt = brandstofGegevens.length === MAX_BRANDSTOFRESULTATEN;
        zoekresultaten = scoreOndersteund
          ? verrijkVoertuigen(data, brandstofGegevens, kentekenHistorie)
          : data.map(voertuig => ({
            ...voertuig,
            gezienOp: kentekenHistorie.get(voertuig.kenteken) ?? [],
            bijzonderheidsscore: null
          }));
        stelScoreBedieningIn();
        if (data.length > 1) {
          toonResultaatFilters(zoekresultaten);
        }
        toonGefilterdeResultaten();
      } catch (e) {
        setStatus("🔴 Fout bij ophalen: " + e.message);
      }
    }

    async function haalRdwGegevens(base, params) {
      const antwoord = await fetch(`${base}?${params}`);
      if (!antwoord.ok) {
        throw new Error(`RDW gaf status ${antwoord.status}`);
      }

      const gegevens = await antwoord.json();
      if (!Array.isArray(gegevens)) {
        throw new Error("RDW gaf een onverwacht antwoord");
      }
      return gegevens;
    }

    function parseCsvRegel(regel) {
      const velden = [];
      let waarde = "";
      let tussenAanhalingstekens = false;

      for (let positie = 0; positie < regel.length; positie++) {
        const teken = regel[positie];
        if (teken === '"' && tussenAanhalingstekens && regel[positie + 1] === '"') {
          waarde += '"';
          positie++;
        } else if (teken === '"') {
          tussenAanhalingstekens = !tussenAanhalingstekens;
        } else if (teken === "," && !tussenAanhalingstekens) {
          velden.push(waarde);
          waarde = "";
        } else {
          waarde += teken;
        }
      }
      velden.push(waarde);
      return velden;
    }

    function haalKentekenUitZoekopdracht(zoekopdracht) {
      const delen = zoekopdracht.toUpperCase().match(/[A-Z0-9]+/g) ?? [];
      let kandidaat = "";

      for (const deel of delen) {
        kandidaat += deel;
        if (kandidaat.length === 6) {
          return /[A-Z]/.test(kandidaat) && /\d/.test(kandidaat)
            ? kandidaat
            : null;
        }
        if (kandidaat.length > 6) return null;
      }
      return null;
    }

    function parseKentekenHistorie(csv) {
      const historie = new Map();
      const regels = csv.replace(/^\uFEFF/, "").split(/\r?\n/);

      for (const regel of regels.slice(1)) {
        if (!regel.trim()) continue;
        const [zoekopdracht, tijdstip] = parseCsvRegel(regel);
        const kenteken = haalKentekenUitZoekopdracht(zoekopdracht ?? "");
        const gezienOp = new Date(tijdstip);
        if (!kenteken || Number.isNaN(gezienOp.getTime())) continue;

        const datums = historie.get(kenteken) ?? [];
        datums.push(gezienOp);
        historie.set(kenteken, datums);
      }

      for (const [kenteken, datums] of historie) {
        datums.sort((eerste, tweede) => tweede.getTime() - eerste.getTime());
        historie.set(kenteken, datums);
      }
      return historie;
    }

    function haalKentekenHistorie() {
      kentekenHistorieAanvraag ??= fetch("kenteken.csv")
        .then(antwoord => {
          if (!antwoord.ok) {
            throw new Error(`kentekenhistorie gaf status ${antwoord.status}`);
          }
          return antwoord.text();
        })
        .then(parseKentekenHistorie);
      return kentekenHistorieAanvraag;
    }

    function maakKentekenFilter(kenteken) {
      return kenteken.length >= 6
        ? `kenteken='${kenteken}'`
        : `starts_with(kenteken,'${kenteken}')`;
    }

    function haalBrandstofGegevens(kenteken) {
      const params = new URLSearchParams({
        $select: [
          "kenteken",
          "brandstof_omschrijving",
          "nettomaximumvermogen",
          "netto_max_vermogen_elektrisch",
          "nominaal_continu_maximumvermogen",
          "co2_uitstoot_gecombineerd"
        ].join(","),
        $where: maakKentekenFilter(kenteken),
        $limit: MAX_BRANDSTOFRESULTATEN,
        $order: "kenteken ASC"
      });
      return haalRdwGegevens(BRANDSTOFFEN_BASE, params);
    }

    function getalOfNull(waarde) {
      if (waarde === null || waarde === undefined || waarde === "") return null;
      const getal = Number(waarde);
      return Number.isFinite(getal) ? getal : null;
    }

    function maximumVeldwaarde(records, velden) {
      let maximum = null;
      for (const record of records) {
        for (const veld of velden) {
          const waarde = getalOfNull(record[veld]);
          if (waarde !== null && (maximum === null || waarde > maximum)) {
            maximum = waarde;
          }
        }
      }
      return maximum;
    }

    function jaarOfNull(datum) {
      if (!datum || String(datum).length < 4) return null;
      const jaar = Number(String(datum).slice(0, 4));
      return Number.isInteger(jaar) ? jaar : null;
    }

    function begrens(waarde, minimum, maximum) {
      return Math.min(maximum, Math.max(minimum, waarde));
    }

    function berekenCarrosserieScore(inrichting) {
      const carrosserie = (inrichting ?? "").toLowerCase();
      if (carrosserie === "coupe" || carrosserie === "cabriolet") return 150;
      if (carrosserie === "limousine") return 25;
      return 0;
    }

    function berekenTijdsfactor(leeftijd) {
      if (leeftijd === null) return 1;
      return begrens(2 ** (leeftijd / 30), 1, 2.5);
    }

    function formatTijdsfactor(tijdsfactor) {
      return tijdsfactor.toFixed(2).replace(".", ",");
    }

    function berekenBijzonderheidsscore(voertuig, huidigJaar) {
      const vermogenPk = voertuig.vermogenPk;
      const massaKg = getalOfNull(voertuig.massa_rijklaar);
      const catalogusprijs = getalOfNull(voertuig.catalogusprijs);
      const toelatingsjaar = jaarOfNull(voertuig.datum_eerste_toelating);
      const leeftijd = toelatingsjaar === null ? null : Math.max(0, huidigJaar - toelatingsjaar);
      const heeftBeoordelingsgegevens =
        vermogenPk !== null || massaKg !== null || catalogusprijs !== null || leeftijd !== null;

      if (!heeftBeoordelingsgegevens) {
        return { totaal: null, onderdelen: [] };
      }

      const pkPerTon = vermogenPk === null || massaKg === null || massaKg <= 0
        ? null
        : vermogenPk / (massaKg / 1000);
      const tijdsfactor = berekenTijdsfactor(leeftijd);
      const tijdgecorrigeerdePkPerTon = pkPerTon === null
        ? null
        : pkPerTon * tijdsfactor;
      const teltVermogenMee = !voertuig.isVolledigElektrisch && vermogenPk !== null;
      const vermogenScore = teltVermogenMee
        ? begrens((vermogenPk - 200) * 0.5, 0, 100)
        : 0;
      const hoogVermogenBonus = teltVermogenMee && vermogenPk > 350
        ? begrens(25 + (vermogenPk - 350) * 0.5, 0, 100)
        : 0;
      const verhoudingScore = teltVermogenMee && tijdgecorrigeerdePkPerTon !== null
        ? begrens((tijdgecorrigeerdePkPerTon - 120) * 1.25, 0, 250)
        : 0;
      const prijsScore = catalogusprijs !== null && catalogusprijs > 100_000
        ? begrens(25 + (catalogusprijs - 100_000) / 2000, 0, 150)
        : 0;
      const klassiekerScore = leeftijd !== null
        ? begrens((leeftijd - 30) * 2, 0, 100)
        : 0;
      const carrosserieScore = berekenCarrosserieScore(voertuig.inrichting);
      const eerderGezienScore = voertuig.gezienOp?.length ? EERDER_GEZIEN_BONUS : 0;
      const verhoudingLabel = tijdsfactor > 1
        ? `Pk/ton (tijd x${formatTijdsfactor(tijdsfactor)})`
        : "Pk/ton";
      const onderdelen = [
        { label: "Vermogen", score: vermogenScore + hoogVermogenBonus },
        { label: verhoudingLabel, score: verhoudingScore },
        { label: "Carrosserie", score: carrosserieScore },
        { label: "Prijs", score: prijsScore },
        { label: "Klassieker", score: klassiekerScore },
        { label: "Eerder gezien", score: eerderGezienScore }
      ].filter(onderdeel => onderdeel.score > 0);
      const totaal = onderdelen.reduce((som, onderdeel) => som + onderdeel.score, 0);

      return {
        totaal: Math.round(totaal),
        onderdelen: onderdelen.map(onderdeel => ({
          ...onderdeel,
          score: Math.round(onderdeel.score)
        }))
      };
    }

    function groepeerBrandstofOpKenteken(brandstofGegevens) {
      const perKenteken = new Map();
      for (const record of brandstofGegevens) {
        const records = perKenteken.get(record.kenteken) ?? [];
        records.push(record);
        perKenteken.set(record.kenteken, records);
      }
      return perKenteken;
    }

    function verrijkVoertuig(voertuig, brandstofRecords, gezienOp, huidigJaar) {
      const brandstoffen = [...new Set(
        brandstofRecords.map(record => record.brandstof_omschrijving).filter(Boolean)
      )];
      const isVolledigElektrisch =
        brandstoffen.length > 0 &&
        brandstoffen.every(brandstof => brandstof === "Elektriciteit");
      const verbrandingsvermogenKw = maximumVeldwaarde(
        brandstofRecords,
        ["nettomaximumvermogen"]
      );
      const elektrischVermogenKw = maximumVeldwaarde(
        brandstofRecords,
        ["netto_max_vermogen_elektrisch", "nominaal_continu_maximumvermogen"]
      );
      const vermogenKw = isVolledigElektrisch
        ? elektrischVermogenKw
        : verbrandingsvermogenKw;
      const vermogenPk = vermogenKw === null ? null : Math.round(vermogenKw * 1.35962);
      const massaKg = getalOfNull(voertuig.massa_rijklaar);
      const pkPerTon = vermogenPk === null || massaKg === null || massaKg <= 0
        ? null
        : Math.round(vermogenPk / (massaKg / 1000));
      const verrijktVoertuig = {
        ...voertuig,
        gezienOp,
        brandstof_omschrijving: brandstoffen.join(" + ") || null,
        co2_uitstoot_gecombineerd: maximumVeldwaarde(
          brandstofRecords,
          ["co2_uitstoot_gecombineerd"]
        ),
        isVolledigElektrisch,
        vermogenKw,
        vermogenPk,
        pkPerTon
      };
      const bijzonderheidsscore = brandstofRecords.length
        ? berekenBijzonderheidsscore(verrijktVoertuig, huidigJaar)
        : { totaal: null, onderdelen: [] };

      return {
        ...verrijktVoertuig,
        bijzonderheidsscore: bijzonderheidsscore.totaal,
        scoreOnderdelen: bijzonderheidsscore.onderdelen
      };
    }

    function verrijkVoertuigen(voertuigen, brandstofGegevens, kentekenHistorie) {
      const brandstofPerKenteken = groepeerBrandstofOpKenteken(brandstofGegevens);
      const huidigJaar = new Date().getFullYear();
      return voertuigen.map(voertuig =>
        verrijkVoertuig(
          voertuig,
          brandstofPerKenteken.get(voertuig.kenteken) ?? [],
          kentekenHistorie.get(voertuig.kenteken) ?? [],
          huidigJaar
        )
      );
    }

    function uniekeGesorteerdeWaarden(voertuigen, veld) {
      return [...new Set(voertuigen.map(voertuig => voertuig[veld]).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b, "nl"));
    }

    function vervangFilterOpties(select, waarden, geselecteerdeWaarde = "") {
      select.length = 1;
      for (const waarde of waarden) {
        const optie = document.createElement("option");
        optie.value = waarde;
        optie.textContent = waarde;
        select.appendChild(optie);
      }
      select.value = waarden.includes(geselecteerdeWaarde) ? geselecteerdeWaarde : "";
    }

    function toonResultaatFilters(voertuigen) {
      const merkFilter = document.getElementById("filterMerk");
      const kleurFilter = document.getElementById("filterKleur");

      vervangFilterOpties(merkFilter, uniekeGesorteerdeWaarden(voertuigen, "merk"));
      vervangFilterOpties(kleurFilter, uniekeGesorteerdeWaarden(voertuigen, "eerste_kleur"));
      document.getElementById("resultaatFilters").classList.remove("hidden");
    }

    function verbergResultaatFilters() {
      const merkFilter = document.getElementById("filterMerk");
      const kleurFilter = document.getElementById("filterKleur");

      merkFilter.value = "";
      kleurFilter.value = "";
      merkFilter.length = 1;
      kleurFilter.length = 1;
      document.getElementById("filterScore").value = "0";
      document.getElementById("sortering").value = "score";
      document.getElementById("resultaatFilters").classList.add("hidden");
    }

    function stelScoreBedieningIn() {
      const scoreFilter = document.getElementById("filterScore");
      const scoreSortering = document.getElementById("sorteerOpScore");
      const sortering = document.getElementById("sortering");

      scoreFilter.disabled = !scoreOndersteund;
      scoreSortering.disabled = !scoreOndersteund;
      if (!scoreOndersteund) {
        scoreFilter.value = "0";
        sortering.value = "merk";
      } else {
        sortering.value = "score";
      }
    }

    function filterVoertuigen(voertuigen, merk, kleur, minimumScore = 0) {
      return voertuigen.filter(voertuig =>
        (!merk || voertuig.merk === merk) &&
        (!kleur || voertuig.eerste_kleur === kleur) &&
        (!minimumScore ||
          (voertuig.bijzonderheidsscore !== null &&
            voertuig.bijzonderheidsscore >= minimumScore))
      );
    }

    function vergelijkTekst(a, b) {
      return (a ?? "").localeCompare(b ?? "", "nl");
    }

    function vergelijkGetalAflopend(a, b) {
      const eerste = getalOfNull(a);
      const tweede = getalOfNull(b);
      if (eerste === null && tweede === null) return 0;
      if (eerste === null) return 1;
      if (tweede === null) return -1;
      return tweede - eerste;
    }

    function sorteerVoertuigen(voertuigen, sortering) {
      return [...voertuigen].sort((a, b) => {
        let verschil = 0;
        if (sortering === "score") {
          verschil = vergelijkGetalAflopend(a.bijzonderheidsscore, b.bijzonderheidsscore);
        } else if (sortering === "vermogen") {
          verschil = vergelijkGetalAflopend(a.vermogenPk, b.vermogenPk);
        } else if (sortering === "verhouding") {
          verschil = vergelijkGetalAflopend(a.pkPerTon, b.pkPerTon);
        } else if (sortering === "prijs") {
          verschil = vergelijkGetalAflopend(a.catalogusprijs, b.catalogusprijs);
        } else if (sortering === "oudste") {
          verschil = vergelijkTekst(a.datum_eerste_toelating, b.datum_eerste_toelating);
        }

        return verschil ||
          vergelijkTekst(a.merk, b.merk) ||
          vergelijkTekst(a.handelsbenaming, b.handelsbenaming) ||
          vergelijkTekst(a.kenteken, b.kenteken);
      });
    }

    function verversResultaatFilterOpties() {
      const merkFilter = document.getElementById("filterMerk");
      const kleurFilter = document.getElementById("filterKleur");
      const gekozenMerk = merkFilter.value;
      const gekozenKleur = kleurFilter.value;
      const minimumScore = Number(document.getElementById("filterScore").value);
      const voertuigenMetKleur = filterVoertuigen(zoekresultaten, "", gekozenKleur, minimumScore);
      const voertuigenVanMerk = filterVoertuigen(zoekresultaten, gekozenMerk, "", minimumScore);

      vervangFilterOpties(
        merkFilter,
        uniekeGesorteerdeWaarden(voertuigenMetKleur, "merk"),
        gekozenMerk
      );
      vervangFilterOpties(
        kleurFilter,
        uniekeGesorteerdeWaarden(voertuigenVanMerk, "eerste_kleur"),
        gekozenKleur
      );
    }

    function voertuigenOpPagina(voertuigen, pagina) {
      const begin = (pagina - 1) * RESULTATEN_PER_PAGINA;
      return voertuigen.slice(begin, begin + RESULTATEN_PER_PAGINA);
    }

    function aantalPaginas(aantalVoertuigen) {
      return Math.ceil(aantalVoertuigen / RESULTATEN_PER_PAGINA);
    }

    function toonPaginering(aantalVoertuigen) {
      const paginas = aantalPaginas(aantalVoertuigen);
      const paginering = document.getElementById("paginering");

      if (paginas <= 1) {
        verbergPaginering();
        return;
      }

      document.getElementById("vorigePagina").disabled = huidigePagina === 1;
      document.getElementById("volgendePagina").disabled = huidigePagina === paginas;
      document.getElementById("paginaStatus").textContent = `Pagina ${huidigePagina} van ${paginas}`;
      paginering.classList.remove("hidden");
    }

    function verbergPaginering() {
      document.getElementById("paginering").classList.add("hidden");
    }

    function toonGefilterdeResultaten() {
      const merk = document.getElementById("filterMerk").value;
      const kleur = document.getElementById("filterKleur").value;
      const minimumScore = Number(document.getElementById("filterScore").value);
      const sortering = document.getElementById("sortering").value;
      const voertuigen = sorteerVoertuigen(
        filterVoertuigen(zoekresultaten, merk, kleur, minimumScore),
        sortering
      );
      const paginas = aantalPaginas(voertuigen.length);
      huidigePagina = Math.min(huidigePagina, Math.max(paginas, 1));
      const container = document.getElementById("resultaten");

      container.innerHTML = "";
      for (const voertuig of voertuigenOpPagina(voertuigen, huidigePagina)) {
        container.appendChild(maakKaart(voertuig));
      }
      toonPaginering(voertuigen.length);

      const status = document.getElementById("status");
      if (!voertuigen.length) {
        status.textContent = "❌ Geen resultaten voor deze filters.";
      } else if (zoekresultaten.length === MAX_ZOEKRESULTATEN) {
        status.textContent = `✅ ${voertuigen.length} van maximaal ${MAX_ZOEKRESULTATEN} opgehaalde resultaten; verfijn de zoekopdracht voor een vollediger resultaat.${scoreMelding()}`;
      } else if (voertuigen.length === zoekresultaten.length) {
        status.textContent = `✅ ${voertuigen.length} resultaat/resultaten${scoreMelding()}`;
      } else {
        status.textContent = `✅ ${voertuigen.length} van ${zoekresultaten.length} resultaten${scoreMelding()}`;
      }
    }

    function scoreMelding() {
      if (!scoreOndersteund) {
        return " Score en vermogensgegevens zijn alleen beschikbaar bij zoeken op een geheel of gedeeltelijk kenteken.";
      }
      if (brandstofResultaatAfgekapt) {
        return ` De eerste ${MAX_BRANDSTOFRESULTATEN} brandstofregels zijn gebruikt; verfijn het kenteken voor completere bijzonderheidsscores.`;
      }
      return "";
    }

    function wijzigPagina(stap) {
      huidigePagina += stap;
      toonGefilterdeResultaten();
      document.getElementById("status").scrollIntoView({ behavior: "smooth" });
    }

    function pasResultaatFiltersToe() {
      huidigePagina = 1;
      verversResultaatFilterOpties();
      toonGefilterdeResultaten();
    }

    function formatKenteken(raw) {
      if (!raw || raw === '-') return raw;
      // Split on transitions between letters and digits
      const parts = raw.match(/[A-Z]+|\d+/g) ?? [];
      // Split any group of 4+ characters in half
      const segments = parts.flatMap(p => {
        if (p.length >= 4) {
          const mid = Math.ceil(p.length / 2);
          return [p.slice(0, mid), p.slice(mid)];
        }
        return [p];
      });
      return segments.join('-');
    }

    function maakGoogleZoekUrl(voertuig, geformatteerdKenteken) {
      const zoektermen = [
        geformatteerdKenteken,
        voertuig.merk,
        voertuig.handelsbenaming
      ].filter(Boolean);
      return `https://www.google.com/search?q=${encodeURIComponent(zoektermen.join(" "))}`;
    }

    function maakKaart(v) {
      const div = document.createElement("div");
      div.className = "bg-gray-800 rounded-2xl p-4 shadow-lg";

      const kenteken = v.kenteken ?? "-";
      const geformatteerdKenteken = formatKenteken(kenteken);
      const autoweekUrl = `https://www.autoweek.nl/kentekencheck/${geformatteerdKenteken}/`;
      const googleUrl = maakGoogleZoekUrl(v, geformatteerdKenteken);
      const score = formatScore(v.bijzonderheidsscore);
      const scoreUitleg = formatScoreOnderdelen(v.scoreOnderdelen);
      const gezienOp = formatGezienOp(v.gezienOp);
      const vermogen = v.vermogenPk === null || v.vermogenPk === undefined
        ? "Onbekend"
        : `${v.vermogenPk} pk (${formatGetal(v.vermogenKw)} kW)`;

      // Make the card a clickable link to Autoweek kentekencheck
      div.style.cursor = "pointer";
      div.onclick = () => window.open(autoweekUrl, "_blank");

      div.innerHTML = `
        <div class="flex justify-between items-start mb-2">
          <span class="text-yellow-400 font-bold text-xl tracking-widest">${geformatteerdKenteken}</span>
          <div class="text-right">
            <div class="text-yellow-400 font-bold text-lg">🏆 ${score.waarde}</div>
            <div class="text-xs text-gray-400">${score.label}</div>
          </div>
        </div>
        <div class="text-white text-lg font-semibold">${v.merk ?? ""} ${v.handelsbenaming ?? ""}</div>
        ${gezienOp ? `
          <div class="mt-2 rounded-lg bg-yellow-400/10 px-3 py-2 text-sm text-yellow-300">
            <span class="font-semibold">Seen-before:</span> ${gezienOp}
          </div>` : ""}
        <div class="mt-2 grid grid-cols-2 gap-1 text-sm text-gray-300">
          ${rij("🎨 Kleur", v.eerste_kleur)}
          ${rij("📅 Toelating", formatDatum(v.datum_eerste_toelating))}
          ${rij("⚙️ Brandstof", v.brandstof_omschrijving ?? "Onbekend")}
          ${rij("💨 CO2", v.co2_uitstoot_gecombineerd ? v.co2_uitstoot_gecombineerd + " g/km" : null)}
          ${rij("🏋️ Massa", v.massa_rijklaar ? v.massa_rijklaar + " kg" : null)}
          ${rij("🚘 Carrosserie", formatCarrosserie(v.inrichting))}
          ${rij("🔢 Cilinders", v.aantal_cilinders)}
          ${rij("💪 Vermogen", vermogen)}
          ${rij("⚖️ Pk per ton", v.pkPerTon ? v.pkPerTon : null)}
          ${rij("💶 Catalogusprijs", formatPrijs(v.catalogusprijs))}
        </div>
        ${scoreUitleg ? `<div class="mt-3 text-xs text-gray-400">Bijzonderheidsscore: ${scoreUitleg}</div>` : ""}
        <div class="mt-3 flex justify-end gap-4 text-xs">
          <a href="${autoweekUrl}" target="_blank" rel="noopener noreferrer"
            onclick="event.stopPropagation()" class="text-gray-400 hover:text-yellow-400">↗ AutoWeek</a>
          <a href="${googleUrl}" target="_blank" rel="noopener noreferrer"
            onclick="event.stopPropagation()" class="text-gray-400 hover:text-yellow-400">↗ Google</a>
        </div>`;
      return div;
    }

    function formatCarrosserie(inrichting) {
      if (!inrichting || inrichting === "Niet geregistreerd") return null;
      return inrichting.charAt(0).toUpperCase() + inrichting.slice(1);
    }

    function formatGezienOp(datums) {
      if (!datums?.length) return "";
      const uniekeDatums = new Set();
      for (const datum of datums) {
        uniekeDatums.add(datum.toISOString().slice(0, 10));
      }
      return [...uniekeDatums]
        .map(datum => formatDatum(datum.replaceAll("-", "")))
        .join(", ");
    }

    function formatScoreOnderdelen(onderdelen) {
      if (!onderdelen?.length) return "";
      return onderdelen
        .map(onderdeel => `${onderdeel.label} ${onderdeel.score}`)
        .join(" · ");
    }

    function formatScore(score) {
      if (score === null || score === undefined) {
        return { waarde: "Onbekend", label: "Geen vermogensgegevens" };
      }
      if (score >= 650) return { waarde: score, label: "Exotisch" };
      if (score >= 450) return { waarde: score, label: "Zeer bijzonder" };
      if (score >= 250) return { waarde: score, label: "Sportief" };
      if (score >= 100) return { waarde: score, label: "Interessant" };
      return { waarde: score, label: "Normaal" };
    }

    function formatGetal(waarde) {
      return new Intl.NumberFormat("nl-NL", { maximumFractionDigits: 1 }).format(waarde);
    }

    function formatPrijs(waarde) {
      const prijs = getalOfNull(waarde);
      if (prijs === null) return null;
      return new Intl.NumberFormat("nl-NL", {
        style: "currency",
        currency: "EUR",
        maximumFractionDigits: 0
      }).format(prijs);
    }

    function rij(label, waarde) {
      if (!waarde) return "";
      return `<div>${label}</div><div class="font-medium text-white">${waarde}</div>`;
    }

    function formatDatum(d) {
      if (!d || d.length < 8) return d ?? "-";
      return `${d.slice(6,8)}-${d.slice(4,6)}-${d.slice(0,4)}`;
    }

    // Search on Enter key
    document.addEventListener("keydown", e => { if (e.key === "Enter") zoek(); });
    document.getElementById("filterMerk").addEventListener("change", pasResultaatFiltersToe);
    document.getElementById("filterKleur").addEventListener("change", pasResultaatFiltersToe);
    document.getElementById("filterScore").addEventListener("change", pasResultaatFiltersToe);
    document.getElementById("sortering").addEventListener("change", pasResultaatFiltersToe);
    document.getElementById("vorigePagina").addEventListener("click", () => wijzigPagina(-1));
    document.getElementById("volgendePagina").addEventListener("click", () => wijzigPagina(1));

    const zoekcriteriaUitUrl = herstelZoekcriteriaUitUrl();
    if (Object.values(zoekcriteriaUitUrl).some(Boolean)) {
      zoek(false);
    }
  </script>
</body>
</html>
